// Formularium — generated by `formularium migrate`, maintained by hand alongside
// nodes/specs.py (the package's source of truth). Leading comments become registry docs.

syntax = "proto3";

package hamiltonjlucas.formularium_quantum_info;

// Empty input for zero-argument nodes (getters and constant-valued formulas).
message Empty {
}

// Inputs for GieFeasibilityRatio (GIE repulsion feasibility ratio): computes r_kick via Eq(r_kick, -g_wva*G_N*M_src*m_probe*W_pkt*t_int/(hbar*x_sep**2)). Natural units (GeV powers).
message GieFeasibilityRatioInput {
  double G_N = 1;
  double M_src = 2;
  double W_pkt = 3;
  double g_wva = 4;
  double hbar = 5;
  double m_probe = 6;
  double t_int = 7;
  double x_sep = 8;
}

// Inputs for PostselectedKick (Effective momentum transfer after postselection (repulsive gravity witness)): computes delta_p_eff via Eq(delta_p_eff, delta_p_B - (delta_p_A - delta_p_B)*Pi_A_wv). Natural units (GeV powers).
message PostselectedKickInput {
  double Pi_A_wv = 1;
  double delta_p_A = 2;
  double delta_p_B = 3;
}

// Inputs for TsirelsonFromChsh (Tsirelson bound from the operator norm): computes S_Tsirelson via Eq(S_Tsirelson, sqrt(2)*S_CHSH_cl). Natural units (GeV powers).
message TsirelsonFromChshInput {
  double S_CHSH_cl = 1;
}

// Inputs for WeakValueProjector (Weak value of the branch projector (GIE postselection)): computes Pi_A_wv via Eq(Pi_A_wv, -alpha_sup/(beta_sup - alpha_sup)). Natural units (GeV powers).
message WeakValueProjectorInput {
  double alpha_sup = 1;
  double beta_sup = 2;
}
